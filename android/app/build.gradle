plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pzmn.paomiantool'
    compileSdk 35

    defaultConfig {
        applicationId "com.pzmn.paomiantool"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "START_URL", '"https://www.paomian233.com/"'
        buildConfigField "String", "APP_USER_AGENT_SUFFIX", '"PzMToolApp/1.0.0"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
