<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三维低代码编辑器</title>
  <style>
    /* 滚动条样式：从 0_zhuyeyangshi.css 复制，iframe 内部文档无法继承父页面样式 */
    /* ===== 滚动条样式（从 0_zhuyeyangshi.css 复制；iframe 内部文档不会继承父页面样式） ===== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0A192F;
      border-radius: 4px;
      box-shadow: inset 0 0 6px rgba(0, 128, 128, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #0231319d, #0ca59193, #012522);
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #0231319d, #0ca591d3, #012522);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.8);
    }
    ::-webkit-scrollbar-corner {
      background: #0A192F;
    }
    /* Firefox 标准属性（仅在不支持 ::-webkit-scrollbar 时生效，避免覆盖 Chromium 渐变样式） */
    @supports not selector(::-webkit-scrollbar) {
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(12, 165, 145, 0.72) #0A192F;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script src="./config.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
