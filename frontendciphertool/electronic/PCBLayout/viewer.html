<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tscircuit PCB 设计与仿真引擎</title>
  <script>
    // 运行在 WebWorker 中的 tscircuit eval 引擎，默认关闭遥测并固定本地版本，避免访问 CDN。
    window.TSCIRCUIT_TELEMETRY_DISABLED = true;
    window.TSCIRCUIT_ALLOW_SELECTING_EVAL_VERSION = false;
    window.TSCIRCUIT_LATEST_EVAL_VERSION = '0.0.1626';
    (function () {
      try {
        // PCB Viewer 1.11.x 默认尝试 WebGPU；先默认 canvas 渲染，兼容更多浏览器。
        if (!localStorage.getItem('pcb_viewer_rendering_engine')) {
          localStorage.setItem('pcb_viewer_rendering_engine', JSON.stringify('canvas'));
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000510;
      color: #d8f6ff;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      background: #000510;
    }
    #root > div {
      min-height: 100% !important;
    }
    /* RunFrame 的预览区域 min-height:620px 在窄 iframe 中会撑出滚动条，这里强制随容器高度。 */
    .rf-min-h-\[620px\] {
      min-height: 100% !important;
    }
    .pcb-engine-status {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(0, 255, 200, 0.08) 0%, transparent 55%),
        #000510;
      color: #2ef0c3;
      letter-spacing: 0.5px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .pcb-engine-status.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pcb-engine-status.error {
      color: #ff6b8b;
    }
    .pcb-engine-status .status-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid rgba(46, 240, 195, 0.18);
      border-top-color: #2ef0c3;
      animation: pcb-spin 0.9s linear infinite;
      box-shadow: 0 0 24px rgba(46, 240, 195, 0.25);
    }
    .pcb-engine-status.error .status-spinner { display: none; }
    .pcb-engine-status .status-title {
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .pcb-engine-status .status-sub {
      max-width: 520px;
      font-size: 0.82rem;
      line-height: 1.7;
      color: rgba(216, 246, 255, 0.66);
    }
    @keyframes pcb-spin { to { transform: rotate(360deg); } }
  </style>
  <style>
    /* 滚动条样式：从 0_zhuyeyangshi.css 复制，iframe 内部文档无法继承父页面样式 */
    /* ===== 滚动条样式（从 0_zhuyeyangshi.css 复制；iframe 内部文档不会继承父页面样式） ===== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0A192F;
      border-radius: 4px;
      box-shadow: inset 0 0 6px rgba(0, 128, 128, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #0231319d, #0ca59193, #012522);
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #0231319d, #0ca591d3, #012522);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.8);
    }
    ::-webkit-scrollbar-corner {
      background: #0A192F;
    }
    /* Firefox 标准属性（仅在不支持 ::-webkit-scrollbar 时生效，避免覆盖 Chromium 渐变样式） */
    @supports not selector(::-webkit-scrollbar) {
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(12, 165, 145, 0.72) #0A192F;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="engine-boot-status" class="pcb-engine-status">
    <div class="status-spinner"></div>
    <div class="status-title">TSCIRCUIT ENGINE</div>
    <div class="status-sub" id="engine-boot-status-text">正在解压并启动本地 PCB 设计 / 仿真引擎...</div>
  </div>

  <script src="./vendor/fflate.min.js"></script>
  <script src="./viewer-i18n.js"></script>
  <script>
    (function () {
      'use strict';

      var CODE_STORAGE_KEY = 'pzma-pcb-code';
      var statusEl = document.getElementById('engine-boot-status');
      var statusTextEl = document.getElementById('engine-boot-status-text');
      var rootEl = document.getElementById('root');
      var readySent = false;

      var FALLBACK_CODE = [
        'export default () => (',
        '  <board routingDisabled>',
        '    <voltagesource name="V1" voltage="5V" />',
        '    <resistor name="R1" resistance="1k" footprint="0603" />',
        '    <led name="D1" footprint="0603" color="red" />',
        '    <trace from=".V1 > .pin1" to=".R1 > .pin1" />',
        '    <trace from=".R1 > .pin2" to=".D1 > .pin1" />',
        '    <trace from=".D1 > .pin2" to=".V1 > .pin2" />',
        '    <voltageprobe name="VP_LED" connectsTo=".D1 > .pin1" />',
        '    <analogsimulation duration="10ms" timePerStep="0.1ms" spiceEngine="spicey" />',
        '  </board>',
        ')',
        ''
      ].join('\n');

      function setStatus(text, isError) {
        if (!statusEl || !statusTextEl) return;
        statusTextEl.textContent = text;
        statusEl.classList.toggle('error', !!isError);
      }

      function hideStatus() {
        if (statusEl) statusEl.classList.add('hidden');
      }

      function postToParent(type, payload) {
        try {
          window.parent.postMessage(Object.assign({ source: 'pzma-pcb-engine', type: type }, payload || {}), '*');
        } catch (e) { /* ignore */ }
      }

      function markReady() {
        if (readySent) return;
        readySent = true;
        setStatus('引擎已就绪', false);
        postToParent('ready');
        setTimeout(hideStatus, 650);
      }

      function markError(message) {
        setStatus(message, true);
        postToParent('error', { message: message });
      }

      function decompressWithFflate(arrayBuffer) {
        if (window.fflate && typeof window.fflate.gunzipSync === 'function') {
          try {
            var bytes = window.fflate.gunzipSync(new Uint8Array(arrayBuffer));
            return Promise.resolve(new TextDecoder('utf-8').decode(bytes));
          } catch (e) {
            return Promise.reject(e);
          }
        }
        return Promise.reject(new Error('当前浏览器不支持 gzip 解压（DecompressionStream/fflate 均不可用）'));
      }

      function decompressGzip(arrayBuffer) {
        // 优先使用浏览器原生 DecompressionStream（Chrome/Edge 80+、Safari 16.4+、Firefox 113+）。
        if (typeof DecompressionStream === 'function') {
          try {
            var stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'));
            return new Response(stream).text().catch(function () {
              // 某些服务器可能已经按 Content-Encoding: gzip 透明解压，此时用 fflate 兜底会失败，
              // 由 fetchGzipText 中的响应头判断分支处理；这里仅在流式解压失败时尝试 fflate。
              return decompressWithFflate(arrayBuffer);
            });
          } catch (e) {
            return decompressWithFflate(arrayBuffer);
          }
        }
        return decompressWithFflate(arrayBuffer);
      }

      async function fetchGzipText(url) {
        var response = await fetch(url, { cache: 'force-cache' });
        if (!response.ok) throw new Error('无法加载 ' + url + '（HTTP ' + response.status + '）');

        // 兼容会自动为 .gz 设置 Content-Encoding: gzip 的静态服务器：
        // 此时浏览器已经透明解压，直接按文本读取即可。
        var contentEncoding = (response.headers.get('content-encoding') || '').toLowerCase();
        if (contentEncoding.indexOf('gzip') >= 0) {
          return await response.text();
        }

        var buffer = await response.arrayBuffer();
        return await decompressGzip(buffer);
      }

      async function loadUserCode() {
        var code = null;
        try { code = localStorage.getItem(CODE_STORAGE_KEY); } catch (e) { /* ignore */ }
        if (!code) {
          try {
            var response = await fetch('./circuits/main.tsx', { cache: 'no-store' });
            if (response.ok) code = await response.text();
          } catch (e) { /* ignore */ }
        }
        return code && code.trim() ? code : FALLBACK_CODE;
      }

      function injectUserCode(code) {
        var codeScript = document.createElement('script');
        codeScript.type = 'tscircuit-tsx';
        codeScript.setAttribute('data-path', 'main.tsx');
        codeScript.textContent = code;
        document.body.appendChild(codeScript);
      }

      async function boot() {
        try {
          setStatus('正在读取 PCB 设计代码...', false);
          var code = await loadUserCode();
          injectUserCode(code);

          setStatus('正在加载本地 SPICE / PCB 仿真 worker...', false);
          var workerCode = await fetchGzipText('./vendor/tscircuit-eval-worker.js.gz');
          window.__PZMA_TSCIRCUIT_EVAL_WORKER_URL__ = URL.createObjectURL(
            new Blob([workerCode], { type: 'text/javascript' })
          );

          setStatus('正在加载 tscircuit 设计引擎（约 13MB 本地资源，仅首次较慢）...', false);
          var bundleCode = await fetchGzipText('./vendor/tscircuit-runframe-standalone.min.js.gz');

          var bundleScript = document.createElement('script');
          bundleScript.src = URL.createObjectURL(new Blob([bundleCode], { type: 'text/javascript' }));
          bundleScript.onload = function () {
            // 引擎脚本加载完成后，等待 root 中出现真实内容再通知父页面移除遮罩。
            var checks = 0;
            var poll = setInterval(function () {
              checks += 1;
              if (!rootEl || rootEl.children.length > 0 || checks > 80) {
                clearInterval(poll);
                markReady();
              }
            }, 125);
          };
          bundleScript.onerror = function () {
            markError('tscircuit 引擎脚本加载失败，请确认通过本地 HTTP 服务访问项目。');
          };
          document.body.appendChild(bundleScript);
        } catch (err) {
          var message = err && err.message ? err.message : String(err);
          markError('PCB 引擎启动失败：' + message + '。请通过本地 HTTP 服务访问，并确认 PCBLayout/vendor 资源完整。');
          console.error('[PCBLayout] engine boot failed:', err);
        }
      }

      boot();
    })();
  </script>
</body>
</html>
